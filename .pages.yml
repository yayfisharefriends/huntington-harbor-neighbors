
media:
  input: public/media
  output: /media
  rename: safe
  extensions: [jpg, jpeg, png, webp, avif]

content:
  - name: species
    label: Species profiles
    type: collection
    path: src/content/species
    filename: "{slug}.md"
    format: yaml-frontmatter

    view:
      primary: commonName
      fields: [commonName, scientificName, animalGroup, nativeStatus, status]
      search: [commonName, scientificName]
      sort: [commonName, scientificName, status]
      default:
        sort: commonName
        order: asc

    fields:
      - name: slug
        label: URL name (lowercase, hyphens)
        type: string
        required: true

      - name: commonName
        label: Common name
        type: string
        required: true

      - name: scientificName
        label: Scientific name
        type: string
        required: true

      - name: animalGroup
        label: Animal group
        type: select
        required: true
        options:
          values: [Birds, Mammals, Reptiles, Amphibians, Fish, Invertebrates]

      - name: nativeStatus
        label: Native status
        type: select
        required: true
        options:
          values: [Native, Introduced, Naturalized, Migratory, Unknown]

      - name: diet
        label: Diet
        type: text

      - name: ecologicalRole
        label: Ecological role
        type: text

      - name: description
        label: Description
        type: text

      - name: coolFacts
        label: Cool facts
        type: text

      - name: threatsAndConservation
        label: Threats and conservation actions
        type: text

      - name: mainImage
        label: Main photograph
        type: image
        options:
          path: species
          extensions: [jpg, jpeg, png, webp, avif]

      - name: mainImagePhotographer
        label: Main photograph photographer
        type: string

      - name: mainImageCredit
        label: Main photograph credit
        type: string

      - name: mainImageLicense
        label: Main photograph license
        type: string

      - name: mainImageSourceUrl
        label: Main photograph original source URL
        type: string

      - name: gallery
        label: Additional photographs
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{caption} ({index})"
        fields:
          - name: image
            label: Photograph
            type: image
            options:
              path: species
              extensions: [jpg, jpeg, png, webp, avif]

          - name: caption
            label: Caption
            type: string

          - name: photographer
            label: Photographer
            type: string

          - name: credit
            label: Required credit line
            type: string

          - name: license
            label: License or permission
            type: string

          - name: sourceUrl
            label: Original image source URL
            type: string

      - name: status
        label: Publishing status
        type: select
        required: true
        options:
          values: [Draft, Needs review, Published]

      - name: featured
        label: Feature on homepage
        type: boolean

settings:
  content:
    merge: true
  commit:
    templates:
      create: "Add species profile: {name}"
      update: "Update species profile: {name}"
      delete: "Remove species profile: {name}"
